<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!--
    Favicon. Next.js App Router serves any app/icon.svg as the site icon.

    On a browser tab the mark sits small on a light strip, so unlike the header
    version it gets a solid blue tile behind a white container -- the outline-on-
    transparent version would vanish at 16px. Fill level (~46%) matches the mark
    in components/common/Logo.tsx; keep the two in step by eye.
  -->
  <rect width="32" height="32" rx="7" fill="#2563EB"/>
  <rect x="7" y="7" width="18" height="18" rx="5" fill="none" stroke="#FFFFFF" stroke-width="2.4"/>
  <path d="M7 16.7 H25 V20 A5 5 0 0 1 20 25 H12 A5 5 0 0 1 7 20 Z" fill="#FFFFFF"/>
</svg>
