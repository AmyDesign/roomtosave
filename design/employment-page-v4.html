<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>就业收入页 — 设计稿 v4</title>
<style>
  :root{
    --page:#F7F6F4; --surface:#FFFFFF; --sunken:#F3F1EE;
    --ink:#1F1D1B; --ink-2:#5F5A54; --ink-3:#948E86;
    --line:#E6E3DE; --line-2:#D4D0C9;
    --accent:#185FA5; --accent-hover:#0C447C; --accent-bg:#E9F1FA; --accent-soft:#B9D3EE;
    --accent-light:#2E7EC8; --badge-bg:#E9F1FA; --badge-line:#CFE1F3; --badge-ink:#1B5D9B;
    --r:6px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--ink);
    font:400 14px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;padding:0 24px 72px}

  .top{display:flex;align-items:center;justify-content:space-between;padding:24px 0 18px}
  .brand{display:flex;align-items:center;gap:9px}
  .mark{width:24px;height:24px;border-radius:6px;background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500}
  .brand b{font-weight:500;font-size:15px}
  .top-right{display:flex;align-items:center;gap:12px}
  .ctx{font-size:13px;color:var(--ink-2)}
  /* 语言：分段开关 */
  .sw{display:inline-flex;background:var(--sunken);border:1px solid var(--line);
    border-radius:999px;padding:2px}
  .sw button{border:0;background:transparent;font:inherit;font-size:12px;padding:4px 12px;
    border-radius:999px;color:var(--ink-3);cursor:pointer;transition:.14s;line-height:1.5}
  .sw button:hover{color:var(--ink-2)}
  .sw button.on{background:var(--surface);color:var(--ink);
    box-shadow:0 1px 2px rgba(0,0,0,.07),0 0 0 1px rgba(0,0,0,.04)}

  /* 步骤：圆点 + 连接线，标签在下方 */
  .prog{display:flex;align-items:flex-start;padding:10px 0 30px}
  .prog .st{display:flex;flex-direction:column;align-items:center;gap:11px;flex-shrink:0;width:96px}
  .prog .dot{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;
    justify-content:center;background:transparent;border:1.5px solid var(--line-2);transition:.16s}
  .prog .dot i{width:6px;height:6px;border-radius:50%;background:var(--line-2);display:block}
  .prog .st.done .dot,.prog .st.now .dot{background:var(--accent);border-color:var(--accent)}
  .prog .st.done .dot i,.prog .st.now .dot i{background:#fff}
  .prog .st.now .dot{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--accent-soft)}
  .prog .tx{text-align:center;line-height:1.35}
  .prog .nm{display:block;font-size:13px;font-weight:500;color:var(--ink-3);white-space:nowrap}
  .prog .de{display:block;font-size:11px;color:var(--ink-3);opacity:.75;white-space:nowrap;margin-top:2px}
  .prog .st.done .nm{color:var(--ink-2)}
  .prog .st.now .nm{color:var(--ink)}
  .prog .seg{flex:1;height:2px;background:var(--line);border-radius:1px;margin-top:8px}
  .prog .seg.on{background:var(--accent)}

  h1{font-size:24px;font-weight:500;letter-spacing:-0.012em;margin:0 0 5px}
  .sub{font-size:14px;color:var(--ink-2);margin:0 0 26px}

  /* ---------- 卡片：蓝色可折叠标题条 ---------- */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:14px}
  .card>.hd{width:100%;background:var(--accent);color:#fff;padding:20px 18px;display:flex;
    align-items:center;gap:10px;border:0;font:inherit;cursor:pointer;text-align:left;transition:background .12s}
  .card>.hd:hover{background:var(--accent-light)}
  .card>.hd h2{font-size:14px;font-weight:500;margin:0;flex:1}
  .card>.hd .meta{font-size:12px;color:var(--accent-soft)}
  .chev{width:14px;height:14px;flex-shrink:0;transition:transform .16s;opacity:.85}
  .card.closed .chev{transform:rotate(-90deg)}
  .card.closed>.body{display:none}
  .body{padding:20px}

  /* ---------- 字段网格：按列排，顺着框号往下填 ---------- */
  .grid{display:grid;grid-auto-flow:column;gap:16px 22px}
  .grid.r4{grid-template-rows:repeat(4,auto);grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid.r1{grid-template-rows:auto;grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid.one{grid-auto-flow:row;grid-template-columns:minmax(0,calc(50% - 11px))}
  .f{min-width:0}
  .f>label{display:block;font-size:13px;color:var(--ink-2);margin-bottom:6px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .f>label .q{border-bottom:1px dotted var(--line-2);cursor:help}
  .ctl{display:flex;align-items:stretch;gap:8px}
  .ctl{height:54px}
  .badge{width:54px;height:54px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    background:var(--badge-bg);border:1px solid var(--badge-line);border-radius:var(--r);
    font-size:13px;color:var(--badge-ink);font-variant-numeric:tabular-nums}
  .ipt{flex:1;min-width:0;position:relative}
  .ipt input{width:100%;height:54px;border:1px solid var(--line-2);border-radius:var(--r);
    background:var(--surface);padding:0 14px 0 28px;font:inherit;font-size:16px;text-align:right;
    font-variant-numeric:tabular-nums;color:var(--ink);outline:none;transition:.12s}
  .ipt input::placeholder{color:#C6C1B9}
  .ipt input:hover{border-color:var(--ink-3)}
  .ipt input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
  .ipt .cur{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:15px;color:var(--ink-3);pointer-events:none}

  .check{display:flex;gap:11px;align-items:flex-start;margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
  .check input{width:16px;height:16px;margin:1px 0 0;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
  .check .note{font-size:13px;color:var(--ink-3);margin-top:2px}

  /* ---------- 其他收入：同一套折叠，浅色子标题 ---------- */
  .sub-sec{border-top:1px solid var(--line)}
  .sub-sec:first-child{border-top:0}
  .sub-hd{width:100%;background:transparent;border:0;font:inherit;cursor:pointer;text-align:left;
    display:flex;align-items:center;gap:10px;padding:13px 0;color:var(--ink)}
  .sub-hd:hover{color:var(--accent)}
  .sub-hd .t{flex:1;display:flex;align-items:baseline;gap:9px;min-width:0}
  .sub-hd .tag{font-size:12px;color:var(--ink-3);font-weight:400}
  .sub-hd .sum{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .sub-hd .chev{opacity:.5;color:var(--ink-2)}
  .sub-sec.closed .chev{transform:rotate(-90deg)}
  .sub-sec.closed .panel{display:none}
  .panel{padding:2px 0 16px}
  .note-blk{font-size:12px;color:#5F5A54;line-height:1.65;margin:14px 0 0;
    background:#F0F0F0;border-radius:var(--r);padding:10px 12px}

  .bar{display:flex;justify-content:space-between;align-items:center;margin-top:26px}
  .btn{font:inherit;font-size:14px;height:40px;padding:0 20px;border-radius:var(--r);cursor:pointer;transition:.12s}
  .btn.sec{background:var(--surface);border:1px solid var(--line-2);color:var(--ink-2)}
  .btn.sec:hover{border-color:var(--ink-3);color:var(--ink)}
  .btn.pri{background:var(--accent);border:1px solid var(--accent);color:#fff;font-weight:500;padding:0 26px}
  .btn.pri:hover{background:var(--accent-light);border-color:var(--accent-light)}
  .disc{font-size:12px;color:#5F5A54;margin-top:30px;padding-top:16px;border-top:1px solid var(--line);line-height:1.6}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="brand"><span class="mark">R</span><b>RRSP 优化器</b></div>
    <div class="top-right">
      <span class="ctx">2025 · Québec</span>
      <span class="sw"><button>EN</button><button class="on">中文</button></span>
    </div>
  </div>

  <div class="prog">
    <div class="st done"><span class="dot"><i></i></span>
      <span class="tx"><span class="nm">基本信息</span><span class="de">年度与省份</span></span></div>
    <div class="seg on"></div>
    <div class="st now"><span class="dot"><i></i></span>
      <span class="tx"><span class="nm">就业收入</span><span class="de">T4 与 RL-1</span></span></div>
    <div class="seg"></div>
    <div class="st"><span class="dot"><i></i></span>
      <span class="tx"><span class="nm">供款额度</span><span class="de">RRSP 与 FHSA</span></span></div>
    <div class="seg"></div>
    <div class="st"><span class="dot"><i></i></span>
      <span class="tx"><span class="nm">结果</span><span class="de">供款建议</span></span></div>
  </div>

  <h1>就业收入</h1>
  <p class="sub">照着单据抄写。左侧灰块是框号，顺着往下填即可。</p>

  <section class="card" id="c1">
    <button class="hd" onclick="document.getElementById('c1').classList.toggle('closed')">
      <svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6l4 4 4-4"/></svg>
      <h2>T4 单据</h2><span class="meta">7 项</span>
    </button>
    <div class="body">
      <div class="grid r4">
        <div class="f"><label><span class="q" title="扣除任何款项之前的工资总额">工资</span></label>
          <div class="ctl"><span class="badge">14</span><span class="ipt"><span class="cur">$</span><input placeholder="0.00" value="80,000.00"></span></div></div>
        <div class="f"><label>QPP 供款</label>
          <div class="ctl"><span class="badge">17</span><span class="ipt"><span class="cur">$</span><input placeholder="0.00" value="4,339.20"></span></div></div>
        <div class="f"><label><span class="q" title="第一上限到第二上限之间的收入按 4% 征收，最高 $396">QPP 第二附加供款</span></label>
          <div class="ctl"><span class="badge">17A</span><span class="ipt"><span class="cur">$</span><input placeholder="0.00" value="348.00"></span></div></div>
        <div class="f"><label>EI 保费</label>
          <div class="ctl"><span class="badge">18</span><span class="ipt"><span class="cur">$</span><input placeholder="0.00" value="860.67"></span></div></div>
        <div class="f"><label><span class="q" title="魁省居民此处只填联邦预扣，省税填在 RL-1 Box E">联邦预扣</span></label>
          <div class="ctl"><span class="badge">22</span><span class="ipt"><span class="cur">$</span><input placeholder="0.00" value="10,000.00"></span></div></div>
        <div class="f"><label><span class="q" title="通常等于 Box 14。未满 18 岁或部分年度免除时可能不同">可计养老金收入</span></label>
          <div class="ctl"><span class="badge">26</span><span class="ipt"><span class="cur">$</span><input placeholder="0.00" value="80,000.00"></span></div></div>
        <div class="f"><label>QPIP 保费</label>
          <div class="ctl"><span class="badge">55</span><span class="ipt"><span class="cur">$</span><input placeholder="0.00" value="395.20"></span></div></div>
      </div>
    </div>
  </section>

  <section class="card" id="c2">
    <button class="hd" onclick="document.getElementById('c2').classList.toggle('closed')">
      <svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6l4 4 4-4"/></svg>
      <h2>RL-1 单据</h2><span class="meta">魁省</span>
    </button>
    <div class="body">
      <div class="grid r1">
        <div class="f"><label>魁省预扣</label>
          <div class="ctl"><span class="badge">E</span><span class="ipt"><span class="cur">$</span><input placeholder="0.00" value="8,000.00"></span></div></div>
        <div class="f"><label><span class="q" title="与 T4 Box 17A 相同，两张表必须一致">QPP 第二附加供款</span></label>
          <div class="ctl"><span class="badge">B.B</span><span class="ipt"><span class="cur">$</span><input placeholder="0.00" value="348.00"></span></div></div>
      </div>
      <div class="check">
        <input type="checkbox" id="pd">
        <label for="pd"><div>我有私人处方药保险</div>
          <div class="note">雇主团体计划等。勾选后免缴 RAMQ 药物保险费，最高省 $755。</div></label>
      </div>
    </div>
  </section>

  <section class="card" id="c3">
    <button class="hd" onclick="document.getElementById('c3').classList.toggle('closed')">
      <svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6l4 4 4-4"/></svg>
      <h2>其他收入</h2><span class="meta">按需填写</span>
    </button>
    <div class="body" style="padding:6px 20px 14px">

      <div class="sub-sec closed" id="s1">
        <button class="sub-hd" onclick="document.getElementById('s1').classList.toggle('closed')">
          <svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6l4 4 4-4"/></svg>
          <span class="t">EI 福利 <span class="tag">T4E</span></span>
        </button>
        <div class="panel">
          <div class="grid r1">
            <div class="f"><label>福利金额</label><div class="ctl"><span class="ipt"><span class="cur">$</span><input placeholder="0.00"></span></div></div>
            <div class="f"><label>已预扣税款</label><div class="ctl"><span class="ipt"><span class="cur">$</span><input placeholder="0.00"></span></div></div>
          </div>
        </div>
      </div>

      <div class="sub-sec" id="s2">
        <button class="sub-hd" onclick="document.getElementById('s2').classList.toggle('closed')">
          <svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6l4 4 4-4"/></svg>
          <span class="t">自雇收入 <span class="tag">T2125</span></span>
          <span class="sum">$25,000</span>
        </button>
        <div class="panel">
          <div class="grid one">
            <div class="f"><label><span class="q" title="毛收入减去经营支出，取 T2125 上的净额">净收入</span></label>
              <div class="ctl"><span class="ipt"><span class="cur">$</span><input placeholder="0.00" value="25,000.00"></span></div></div>
          </div>
          <p class="note-blk">自雇需缴纳雇主 + 雇员两部分 QPP，以及自雇费率的 QPIP。对应的扣除与抵免会自动计算。</p>
        </div>
      </div>

      <div class="sub-sec closed" id="s3">
        <button class="sub-hd" onclick="document.getElementById('s3').classList.toggle('closed')">
          <svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6l4 4 4-4"/></svg>
          <span class="t">投资收入 <span class="tag">T5 · T3 · Schedule 3</span></span>
        </button>
        <div class="panel">
          <div class="grid r4" style="grid-template-rows:repeat(3,auto)">
            <div class="f"><label>利息</label><div class="ctl"><span class="ipt"><span class="cur">$</span><input placeholder="0.00"></span></div></div>
            <div class="f"><label>合资格股息</label><div class="ctl"><span class="ipt"><span class="cur">$</span><input placeholder="0.00"></span></div></div>
            <div class="f"><label>非合资格股息</label><div class="ctl"><span class="ipt"><span class="cur">$</span><input placeholder="0.00"></span></div></div>
            <div class="f"><label>资本利得</label><div class="ctl"><span class="ipt"><span class="cur">$</span><input placeholder="0.00"></span></div></div>
            <div class="f"><label>资本损失</label><div class="ctl"><span class="ipt"><span class="cur">$</span><input placeholder="0.00"></span></div></div>
          </div>
        </div>
      </div>

    </div>
  </section>

  <div class="bar">
    <button class="btn sec">上一步</button>
    <button class="btn pri">继续</button>
  </div>

  <p class="disc">本工具提供估算结果，仅供参考，不构成专业税务建议。最终金额以 CRA 评估为准。</p>

</div>
</body>
</html>
